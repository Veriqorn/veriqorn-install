# Apply this file on top of docker-compose.yml for a licensed Enterprise
# installation. It intentionally changes only application images and the
# read-only license mount; databases, storage, volumes, and networking remain
# identical to Community.
services:
  frontend:
    image: ${ENTERPRISE_FRONTEND_IMAGE:?Set ENTERPRISE_FRONTEND_IMAGE to an authorized immutable Enterprise frontend image reference}

  backend:
    image: ${ENTERPRISE_BACKEND_IMAGE:?Set ENTERPRISE_BACKEND_IMAGE to an authorized immutable Enterprise backend image reference}
    environment:
      VERIQORN_LICENSE_FILE: /run/veriqorn/license/license.json
    volumes:
      - ${VERIQORN_LICENSE_FILE:?Set VERIQORN_LICENSE_FILE to the local license file path}:/run/veriqorn/license/license.json:ro
