services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/veriqorn/veriqorn-frontend}:${PLATFORM_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      VITE_KB_URL: ${NEXT_PUBLIC_KB_URL:-http://localhost:5174}
      NEXT_PUBLIC_KB_URL: ${NEXT_PUBLIC_KB_URL:-http://localhost:5174}
    depends_on:
      - backend

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/veriqorn/veriqorn-backend}:${PLATFORM_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-test_ops}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      BACKEND_SECURE_COOKIES: ${BACKEND_SECURE_COOKIES:-false}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_SERVICE_ACCESS_KEY:?MINIO_SERVICE_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SERVICE_SECRET_KEY:?MINIO_SERVICE_SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BACKEND_BOOTSTRAP_ADMIN_EMAIL: ${BACKEND_BOOTSTRAP_ADMIN_EMAIL:-}
      BACKEND_BOOTSTRAP_ADMIN_PASSWORD: ${BACKEND_BOOTSTRAP_ADMIN_PASSWORD:-}
      BACKEND_V2_RUN_MIGRATIONS: "true"
      PLATFORM_VERSION: ${PLATFORM_VERSION:-latest}
      PLATFORM_UPDATE_AGENT_URL: ${PLATFORM_UPDATE_AGENT_URL:-http://update-agent:8787}
      PLATFORM_UPDATE_AGENT_TOKEN: ${PLATFORM_UPDATE_AGENT_TOKEN:-}
      AI_ANALYSIS_LICENSE_PUBLIC_KEY: ${AI_ANALYSIS_LICENSE_PUBLIC_KEY:-}
      VERIQORN_LICENSE_PUBLIC_KEYS: ${VERIQORN_LICENSE_PUBLIC_KEYS:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      VERIQORN_PUBLIC_HOST: ${VERIQORN_PUBLIC_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  # This is the only service permitted to use Docker. Do not mount the Docker
  # socket into backend or frontend.
  update-agent:
    build:
      context: ./update-agent
    restart: unless-stopped
    environment:
      UPDATE_AGENT_TOKEN: ${PLATFORM_UPDATE_AGENT_TOKEN:?PLATFORM_UPDATE_AGENT_TOKEN is required}
      UPDATE_COMPOSE_FILE: /install/docker-compose.yml
      UPDATE_ENV_FILE: /install/.env
      UPDATE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-veriqorn}
      UPDATE_CURRENT_VERSION: ${PLATFORM_VERSION:-latest}
      UPDATE_BACKEND_IMAGE: ${BACKEND_IMAGE:-ghcr.io/veriqorn/veriqorn-backend}
      UPDATE_FRONTEND_IMAGE: ${FRONTEND_IMAGE:-ghcr.io/veriqorn/veriqorn-frontend}
      UPDATE_RELEASES_URL: ${UPDATE_RELEASES_URL:-https://raw.githubusercontent.com/veriqorn/veriqorn-install/master/releases/latest.json}
      UPDATE_COSIGN_IMAGE: ${UPDATE_COSIGN_IMAGE:-ghcr.io/sigstore/cosign/cosign:v2.4.3}
      UPDATE_COSIGN_IDENTITY: ${UPDATE_COSIGN_IDENTITY:-https://github.com/Veriqorn/veriqorn/.github/workflows/release-community.yml@refs/tags/v*}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/install/docker-compose.yml:ro
      - ./.env:/install/.env:rw
      - update_agent_state:/state

  postgres:
    image: timescale/timescaledb:2.14.2-pg14
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-test_ops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SERVICE_ACCESS_KEY: ${MINIO_SERVICE_ACCESS_KEY:?MINIO_SERVICE_ACCESS_KEY is required}
      MINIO_SERVICE_SECRET_KEY: ${MINIO_SERVICE_SECRET_KEY:?MINIO_SERVICE_SECRET_KEY is required}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/artifacts &&
      mc mb --ignore-existing local/traces &&
      mc mb --ignore-existing local/screenshots &&
      printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::artifacts\",\"arn:aws:s3:::traces\",\"arn:aws:s3:::screenshots\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::artifacts/*\",\"arn:aws:s3:::traces/*\",\"arn:aws:s3:::screenshots/*\"]}]}' > /tmp/veriqorn-app-policy.json &&
      (mc admin policy create local veriqorn-app /tmp/veriqorn-app-policy.json || true) &&
      (mc admin user info local $$MINIO_SERVICE_ACCESS_KEY >/dev/null 2>&1 || mc admin user add local $$MINIO_SERVICE_ACCESS_KEY $$MINIO_SERVICE_SECRET_KEY) &&
      mc admin policy attach local veriqorn-app --user $$MINIO_SERVICE_ACCESS_KEY
      "

volumes:
  postgres_data:
    name: ${VERIQORN_POSTGRES_VOLUME:-veriqorn-postgres-data}
  minio_data:
    name: ${VERIQORN_MINIO_VOLUME:-veriqorn-minio-data}
  update_agent_state:
    name: ${VERIQORN_UPDATE_AGENT_VOLUME:-veriqorn-update-agent-state}
  caddy_data:
  caddy_config:
